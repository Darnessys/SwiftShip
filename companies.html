<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشركات | نظام الشحن</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #e67e22; /* البرتقالي الـ Warm الراكز */
            --header-grad: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
            --bg-color: #f0f2f5;
            --text-dark: #2d3436;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; }

        .header {
            background: var(--header-grad); color: white; padding: 25px 20px;
            display: flex; align-items: center; border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px; box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
        }

        .header a { color: white; text-decoration: none; margin-left: 15px; }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        .card {
            background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: -10px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); }
        
        input {
            width: 100%; padding: 12px; border: 2px solid #eee;
            border-radius: 10px; box-sizing: border-box; outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--primary-color); background: #fffaf5; }

        .btn-save {
            background: var(--header-grad); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .company-list {
            width: 100%; background: white; border-radius: 20px;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-collapse: collapse; margin-top: 15px;
        }

        .company-list td { padding: 15px; border-bottom: 1px solid #f5f5f5; }

        .comp-card { display: flex; justify-content: space-between; align-items: center; }
        .price-badge { background: #fff4e6; color: #e67e22; padding: 4px 10px; border-radius: 8px; font-weight: bold; }
        
        .id-label { font-size: 0.75rem; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html"><i class="fas fa-arrow-right"></i></a>
        <h2 style="margin:0; font-size:1.3rem;">إضافة شركة شحن</h2>
    </div>

    <div class="container">
        <div class="card">
            <div class="form-group">
                <label><i class="fas fa-building"></i> اسم الشركة:</label>
                <input type="text" id="compName" placeholder="مثلاً: شركة الفارس">
            </div>
            <div class="form-group">
                <label><i class="fas fa-tags"></i> سعر الطرد (ج.م):</label>
                <input type="number" id="compPrice" placeholder="0.00">
            </div>
            <button class="btn-save" onclick="addCompany()">حفظ الشركة</button>
        </div>

        <h3 style="margin: 25px 10px 10px; color: var(--text-dark);">الشركات المتعاقد معها</h3>
        <table class="company-list">
            <tbody id="companyBody"></tbody>
        </table>
    </div>

    <script>
        function render() {
            const companies = JSON.parse(localStorage.getItem('companies')) || [];
            const tbody = document.getElementById('companyBody');
            
            tbody.innerHTML = companies.map(c => `
                <tr>
                    <td>
                        <div class="comp-card">
                            <div>
                                <span class="id-label">كود #${c.id}</span>
                                <div style="font-weight:bold; font-size:1.1rem; margin:3px 0;">${c.name}</div>
                                <span class="price-badge">${c.price} ج.م للطرد</span>
                            </div>
                            <button onclick="deleteCompany(${c.id})" style="background:none; border:none; color:#ff7675; cursor:pointer; font-size:1.1rem;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>`).join('');
        }

        function addCompany() {
            const name = document.getElementById('compName').value.trim();
            const price = document.getElementById('compPrice').value.trim();
            
            if(!name || !price) return alert("برجاء إدخال اسم الشركة وسعر الطرد");
            
            let companies = JSON.parse(localStorage.getItem('companies')) || [];
            
            // توليد الـ ID مع التأكد من تحويله لرقم (لحل مشكلة الـ undefined)
            const lastId = companies.length > 0 ? Math.max(...companies.map(c => parseInt(c.id) || 0)) : 0;
            const newId = lastId + 1;

            const newCompany = {
                id: newId,
                name: name,
                price: price
            };

            companies.push(newCompany);
            localStorage.setItem('companies', JSON.stringify(companies));
            
            document.getElementById('compName').value = "";
            document.getElementById('compPrice').value = "";
            render();
        }

        function deleteCompany(id) {
            if(!confirm("حذف الشركة؟")) return;
            let companies = JSON.parse(localStorage.getItem('companies')) || [];
            companies = companies.filter(c => c.id !== id);
            localStorage.setItem('companies', JSON.stringify(companies));
            render();
        }

        render();
    </script>
</body>
</html>
