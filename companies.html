<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشركات | SwiftShip</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #e67e22; 
            --header-grad: linear-gradient(135deg, #e67e22 0%, #f39c12 100%);
            --glass: rgba(255, 255, 255, 0.95);
            --edit-color: #0984e3;
            --delete-color: #d63031;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; padding: 0; min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        .header {
            background: var(--header-grad); color: white; padding: 20px;
            display: flex; align-items: center; border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header a { color: white; text-decoration: none; margin-left: 15px; font-size: 1.2rem; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }

        .card {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3); margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
        
        input {
            width: 100%; padding: 14px; border: 1px solid #ddd;
            border-radius: 12px; box-sizing: border-box; outline: none; font-size: 1rem;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(230, 126, 34, 0.2); }

        .btn-save {
            background: var(--header-grad); color: white; border: none;
            width: 100%; padding: 16px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-update { background: linear-gradient(135deg, #0984e3, #74b9ff); display: none; }

        h3 { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin-top: 20px; }

        .company-list {
            width: 100%; background: white; border-radius: 20px;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-collapse: collapse;
        }

        .company-list td { padding: 15px; border-bottom: 1px solid #eee; }

        .comp-card { display: flex; justify-content: space-between; align-items: center; }
        .price-badge { background: #fff4e6; color: #e67e22; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; }
        .id-label { font-size: 0.75rem; color: #aaa; font-weight: bold; }

        .actions { display: flex; gap: 15px; }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .btn-edit { color: var(--edit-color); }
        .btn-delete { color: var(--delete-color); }
        .btn-action:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html"><i class="fas fa-arrow-right"></i></a>
        <h2 style="margin:0; font-size:1.3rem;">إدارة شركات الشحن 🚚</h2>
    </div>

    <div class="container">
        <div class="card">
            <input type="hidden" id="editKey">
            <div class="form-group">
                <label><i class="fas fa-building"></i> اسم الشركة:</label>
                <input type="text" id="compName" placeholder="مثلاً: شركة الفارس">
            </div>
            <div class="form-group">
                <label><i class="fas fa-tags"></i> سعر الطرد (ج.م):</label>
                <input type="number" id="compPrice" placeholder="0.00">
            </div>
            <button class="btn-save" id="saveBtn" onclick="addCompany()">حفظ الشركة 💾</button>
            <button class="btn-save btn-update" id="updateBtn" onclick="updateCompany()">تحديث البيانات 🔄</button>
            <button class="btn-save" id="cancelBtn" onclick="resetForm()" style="background:#636e72; margin-top:10px; display:none;">إلغاء</button>
        </div>

        <h3>الشركات المتعاقد معها (Live)</h3>
        <table class="company-list">
            <tbody id="companyBody">
                <tr><td style="text-align:center; padding:20px;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzjuBkBAKS5Y_gU7qmwwaMh1Ay9me1uds",
            authDomain: "swiftship-c829c.firebaseapp.com",
            projectId: "swiftship-c829c",
            databaseURL: "https://swiftship-c829c-default-rtdb.firebaseio.com/",
            storageBucket: "swiftship-c829c.firebasestorage.app",
            messagingSenderId: "410866251849",
            appId: "1:410866251849:web:4c606d59d83c2c2756a798"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allCompanies = {};

        // جلب البيانات لحظياً
        db.ref('companies').on('value', (snapshot) => {
            const tbody = document.getElementById('companyBody');
            allCompanies = snapshot.val() || {};
            
            if (Object.keys(allCompanies).length === 0) {
                tbody.innerHTML = '<tr><td style="text-align:center; padding:20px; color:#636e72;">لا توجد شركات مسجلة</td></tr>';
                return;
            }

            let rows = '';
            Object.keys(allCompanies).forEach((key) => {
                const c = allCompanies[key];
                rows += `
                <tr>
                    <td>
                        <div class="comp-card">
                            <div>
                                <span class="id-label">كود #${c.id}</span>
                                <div style="font-weight:bold; font-size:1.1rem; margin:3px 0;">${c.name}</div>
                                <span class="price-badge">${c.price} ج.م للطرد</span>
                            </div>
                            <div class="actions">
                                <button onclick="prepareEdit('${key}')" class="btn-action btn-edit"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteCompany('${key}')" class="btn-action btn-delete"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = rows;
        });

        // إضافة شركة مع منع التكرار
        function addCompany() {
            const name = document.getElementById('compName').value.trim();
            const price = document.getElementById('compPrice').value.trim();
            
            if(!name || !price) return alert("برجاء إدخال كافة البيانات");

            // التحقق من عدم التكرار
            const isDuplicate = Object.values(allCompanies).some(c => c.name === name);
            if(isDuplicate) return alert("هذه الشركة مسجلة بالفعل!");

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;

            db.ref('companies').limitToLast(1).once('value', (snapshot) => {
                let newId = 1;
                const lastData = snapshot.val();
                if (lastData) {
                    const lastKey = Object.keys(lastData)[0];
                    newId = parseInt(lastData[lastKey].id) + 1;
                }

                db.ref('companies').push({ id: newId, name, price })
                .then(() => { resetForm(); saveBtn.disabled = false; });
            });
        }

        // تحضير التعديل
        function prepareEdit(key) {
            const comp = allCompanies[key];
            document.getElementById('compName').value = comp.name;
            document.getElementById('compPrice').value = comp.price;
            document.getElementById('editKey').value = key;

            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('updateBtn').style.display = 'block';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo(0,0);
        }

        // تحديث البيانات
        function updateCompany() {
            const key = document.getElementById('editKey').value;
            const name = document.getElementById('compName').value.trim();
            const price = document.getElementById('compPrice').value.trim();

            if(!name || !price) return alert("لا يمكن ترك الخانات فارغة");

            db.ref('companies/' + key).update({ name, price })
            .then(() => { resetForm(); alert("تم التحديث بنجاح"); });
        }

        function resetForm() {
            document.getElementById('compName').value = "";
            document.getElementById('compPrice').value = "";
            document.getElementById('editKey').value = "";
            document.getElementById('saveBtn').style.display = 'block';
            document.getElementById('updateBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('saveBtn').disabled = false;
        }

        function deleteCompany(key) {
            if(!confirm("حذف الشركة؟")) return;
            db.ref('companies/' + key).remove();
        }
    </script>
</body>
</html>
