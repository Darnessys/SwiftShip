<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء | CashUp</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6c5ce7; 
            --header-grad: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --bg: #f8f9fa;
            --glass: rgba(255, 255, 255, 0.95);
            --edit-color: #0984e3;
            --delete-color: #d63031;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; padding: 0; min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        .header {
            background: var(--header-grad); color: white; padding: 20px;
            display: flex; align-items: center; border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header a { color: white; text-decoration: none; margin-left: 15px; font-size: 1.2rem; }
        .container { padding: 20px; max-width: 650px; margin: 0 auto; }

        .card {
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3); margin-bottom: 20px;
        }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--primary); }
        
        input {
            width: 100%; padding: 14px; border: 1px solid #ddd;
            border-radius: 12px; box-sizing: border-box; outline: none; font-size: 1rem;
            color: #2d3436;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(108,92,231,0.2); }

        .search-box-container {
            position: relative; margin-bottom: 15px;
        }
        .search-box-container input {
            padding-right: 45px; border: 2px solid #eee; background: white; font-weight: 500;
        }
        .search-box-container input:focus {
            border-color: var(--primary);
        }
        .search-box-container i {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            color: #b2bec3; font-size: 1.1rem;
        }

        .btn-save {
            background: var(--header-grad); color: white; border: none;
            width: 100%; padding: 16px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .btn-update { background: linear-gradient(135deg, #0984e3, #74b9ff); display: none; }

        h3 { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin-top: 20px; margin-bottom: 10px; }

        .customer-list {
            width: 100%; background: white; border-radius: 20px;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-collapse: collapse;
        }

        .customer-list td { padding: 15px; border-bottom: 1px solid #eee; }
        .customer-list tr:last-child td { border-bottom: none; }

        .cust-info { display: flex; justify-content: space-between; align-items: center; }
        .id-badge { background: #f1f0ff; color: var(--primary); padding: 2px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
        
        .actions { display: flex; gap: 15px; }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .btn-edit { color: var(--edit-color); }
        .btn-delete { color: var(--delete-color); }
        .btn-action:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="header">
        <a href="dashboard.html"><i class="fas fa-arrow-right"></i></a>
        <h2 style="margin:0; font-size:1.3rem;">إدارة العملاء 🌍 <span id="companyBadge" style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 8px; vertical-align: middle;">⚙️ جاري الفحص...</span></h2>
    </div>

    <div class="container">
        <div class="card">
            <input type="hidden" id="editKey"> 
            <div class="form-group">
                <label>اسم العميل:</label>
                <input type="text" id="custName" placeholder="الاسم ثلاثي">
            </div>
            <div class="form-group">
                <label>رقم التليفون:</label>
                <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
            </div>
            <button class="btn-save" id="saveBtn" onclick="addCustomer()">حفظ في السحاب ✅</button>
            <button class="btn-save btn-update" id="updateBtn" onclick="updateCustomer()">تحديث البيانات 🔄</button>
            <button class="btn-save" id="cancelBtn" onclick="resetForm()" style="background:#636e72; margin-top:10px; display:none;">إلغاء التعديل</button>
        </div>

        <h3>العملاء المسجلين (Live)</h3>
        
        <div class="search-box-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" onkeyup="searchCustomers()" placeholder="ابحث بسرعة باسم العميل أو رقم الهاتف...">
        </div>

        <table class="customer-list">
            <tbody id="customerBody">
                <tr><td style="text-align:center; padding:20px;">جاري التحقق من الصلاحيات وجلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="toast" style="display:none; position:fixed; bottom:20px; left:20px; background:#6c5ce7; color:white; padding:15px 25px; border-radius:12px; font-weight:bold; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:9999; direction:rtl; min-width:260px; text-align:center; font-family:'Segoe UI', sans-serif;"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzjuBkBAKS5Y_gU7qmwwaMh1Ay9me1uds",
            authDomain: "swiftship-c829c.firebaseapp.com",
            projectId: "swiftship-c829c",
            databaseURL: "https://swiftship-c829c-default-rtdb.firebaseio.com/",
            storageBucket: "swiftship-c829c.firebasestorage.app",
            messagingSenderId: "410866251849",
            appId: "1:410866251849:web:4c606d59d83c2c2756a798"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentCompanyId = "";
        let allCustomers = {}; 

        function showNotification(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.background = isError ? '#d63031' : '#6c5ce7';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        // حارس بوابة الأمان المطور - تم تحويله بالكامل إلى .on للبث الحي التلقائي الفوري لمنع تعليق الداتا
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentCompanyId = user.email.split('@')[0].toLowerCase().replace(/[^a-zA-Z0-9_]/g, "");
                
                // تحويل لـ .on لمراقبة حالة مفتاح التفعيل فورًا وتفادي مشكلة الـ Refresh
                db.ref('companies/' + currentCompanyId + '/active_key').on('value', snap => {
                    const isActive = snap.val();
                    
                    if (isActive === true || isActive === "active") {
                        document.getElementById('companyBadge').innerText = "سيرفر: " + currentCompanyId.toUpperCase();
                        listenToCustomers(); // جلب البيانات والمزامنة الحية فورًا
                    } else {
                        showNotification("عذراً، الحساب غير مفعل حالياً ومحجوب عن الصلاحيات السحابية! 🔒", true);
                        setTimeout(() => { window.location.href = "pending.html"; }, 2000);
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        function listenToCustomers() {
            db.ref('companies/' + currentCompanyId + '/customers').on('value', (snapshot) => {
                const tbody = document.getElementById('customerBody');
                allCustomers = snapshot.val() || {};
                
                if (Object.keys(allCustomers).length === 0) {
                    tbody.innerHTML = '<tr><td style="text-align:center; padding:20px; color:#636e72;">لا يوجد عملاء مسجلين لهذه الشركة حالياً</td></tr>';
                    return;
                }

                renderTable(allCustomers);
                searchCustomers();
            });
        }

        function renderTable(customersData) {
            const tbody = document.getElementById('customerBody');
            let rows = '';
            
            Object.keys(customersData).forEach((key) => {
                const c = customersData[key];
                const displayId = c.id ? c.id : "---";
                const displayPhone = c.phone ? c.phone : "بدون هاتف";
                
                rows += `
                <tr class="customer-row">
                    <td>
                        <div class="cust-info">
                            <div>
                                <div>
                                    <span class="id-badge">ID: #${displayId}</span>
                                    <div style="margin-top:5px;" class="search-name"><b>${c.name}</b></div>
                                    <div style="color:gray; font-size:0.9rem;" class="search-phone">${displayPhone}</div>
                                </div>
                            </div>
                            <div class="actions">
                                <button onclick="prepareEdit('${key}')" class="btn-action btn-edit" title="تعديل"><i class="fas fa-edit"></i></button>
                                <button onclick="confirmDelete('${key}')" class="btn-action btn-delete" title="حذف"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    </td>
                </tr>`;
            });
            
            tbody.innerHTML = rows;
        }

        function searchCustomers() {
            const filter = document.getElementById('searchInput').value.toLowerCase().trim();
            const rows = document.getElementsByClassName('customer-row');

            for (let i = 0; i < rows.length; i++) {
                const nameElement = rows[i].querySelector('.search-name');
                const phoneElement = rows[i].querySelector('.search-phone');
                
                if(!nameElement || !phoneElement) continue;

                const nameText = nameElement.innerText.toLowerCase();
                const phoneText = phoneElement.innerText.toLowerCase();

                if (nameText.includes(filter) || phoneText.includes(filter)) {
                    rows[i].style.display = "";
                } else {
                    rows[i].style.display = "none";
                }
            }
        }

        function addCustomer() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            
            if(!name || !phone) return showNotification("برجاء إدخال اسم العميل ورقم الهاتف بالكامل.", true);

            const isDuplicate = Object.values(allCustomers).some(c => {
                return (c.name && c.name === name) || (c.phone && c.phone === phone);
            });
            
            if(isDuplicate) return showNotification("خطأ: هذا العميل أو رقم الهاتف مسجل بالفعل لدى شركتكم!", true);

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;

            let maxId = 0;
            Object.values(allCustomers).forEach(c => {
                if (c.id && !isNaN(parseInt(c.id))) {
                    if (parseInt(c.id) > maxId) { maxId = parseInt(c.id); }
                }
            });
            const newId = maxId + 1;

            db.ref('companies/' + currentCompanyId + '/customers').push({ 
                id: newId, 
                name, 
                phone, 
                createdAt: new Date().toISOString() 
            })
            .then(() => { 
                showNotification("تم حفظ العميل الجديد بنجاح سحابياً! 🎉");
                resetForm(); 
                saveBtn.disabled = false; 
                document.getElementById('searchInput').value = "";
            })
            .catch((error) => {
                saveBtn.disabled = false;
                showNotification("فشل الحفظ في السيرفر! السبب: " + error.message, true);
            });
        }

        function prepareEdit(key) {
            const customer = allCustomers[key];
            document.getElementById('custName').value = customer.name;
            document.getElementById('custPhone').value = customer.phone ? customer.phone : "";
            document.getElementById('editKey').value = key;

            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('updateBtn').style.display = 'block';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateCustomer() {
            const key = document.getElementById('editKey').value;
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();

            if(!name || !phone) return showNotification("الخانات لا يمكن أن تكون فارغة أثناء التعديل.", true);

            const isDuplicate = Object.keys(allCustomers).some(k => {
                if(k === key) return false; 
                const c = allCustomers[k];
                return (c.name && c.name === name) || (c.phone && c.phone === phone);
            });

            if(isDuplicate) return showNotification("خطأ: الاسم أو رقم الهاتف مسجل لعميل آخر بالفعل!", true);

            db.ref('companies/' + currentCompanyId + '/customers/' + key).update({ name, phone })
            .then(() => { 
                showNotification("تم تحديث بيانات العميل بنجاح 🔄"); 
                resetForm(); 
            })
            .catch(err => showNotification("فشل التحديث: " + err.message, true));
        }

        function resetForm() {
            document.getElementById('custName').value = "";
            document.getElementById('custPhone').value = "";
            document.getElementById('editKey').value = "";
            document.getElementById('saveBtn').style.display = 'block';
            document.getElementById('updateBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function confirmDelete(key) {
            const customerName = allCustomers[key] ? allCustomers[key].name : "هذا العميل";
            const toast = document.getElementById('toast');
            
            toast.innerHTML = `
                <div style="margin-bottom: 10px;">هل أنت متأكد من حذف العميل: <b style="color:#ffea00;">${customerName}</b>؟</div>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button onclick="executeDelete('${key}')" style="background:#d63031; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">نعم، احذف</button>
                    <button onclick="document.getElementById('toast').style.display='none'" style="background:#636e72; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">إلغاء</button>
                </div>
            `;
            toast.style.background = '#2d3436';
            toast.style.display = 'block';
        }

        function executeDelete(key) {
            document.getElementById('toast').style.display = 'none';
            db.ref('companies/' + currentCompanyId + '/customers/' + key).remove()
            .then(() => {
                showNotification("تم حذف العميل بنجاح من قاعدة البيانات.");
            })
            .catch(err => showNotification("فشل الحذف: " + err.message, true));
        }
    </script>
</body>
</html>
