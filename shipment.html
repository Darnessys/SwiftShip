<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الشحنات | SwiftShip</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --accent-color: #00b894;
            --header-grad: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --bg-color: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0; padding: 0; min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        
        .header {
            background: var(--header-grad); color: white; padding: 25px 20px;
            display: flex; align-items: center; border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
        }

        .header a { color: white; text-decoration: none; margin-left: 15px; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }

        .card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: -10px;
            transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.3);
        }

        .card.edit-mode { border: 2px solid var(--accent-color); background: #f7fff9; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--primary-color); }
        
        select, input {
            width: 100%; padding: 12px; border: 2px solid #eee;
            border-radius: 10px; box-sizing: border-box; outline: none; font-size: 1rem;
            transition: border 0.3s;
        }
        
        select:focus, input:focus { border-color: var(--primary-color); }

        /* تنسيق مخصص لـ Select2 لكي يطابق تصميمك الأنيق */
        .select2-container--default .select2-selection--single {
            height: 48px; border: 2px solid #eee; border-radius: 10px; display: flex; align-items: center; outline: none;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 46px; left: 10px; right: auto; /* لضبط السهم جهة اليسار لأن الاتجاه RTL */
        }
        .select2-container { width: 100% !important; margin-top: 5px; }
        .select2-dropdown { border: 2px solid var(--primary-color); border-radius: 10px; z-index: 9999; }
        .select2-search__field { font-size: 16px !important; } /* تمنع الـ Zoom التلقائي في أجهزة الآيفون */

        .calculation-box {
            background: #f8f7ff; padding: 15px; border-radius: 15px;
            text-align: center; border: 1px dashed var(--primary-color); margin: 15px 0;
        }

        .total-price { font-size: 1.6rem; color: var(--primary-color); font-weight: bold; }

        .btn-submit {
            background: var(--header-grad); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 12px;
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .btn-submit.edit-btn { background: var(--accent-color); }

        .recent-table {
            width: 100%; background: white; border-radius: 20px;
            overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-collapse: collapse; margin-top: 20px;
        }

        .recent-table th { background: #fdfdff; padding: 12px; font-size: 0.8rem; color: #888; text-align: right; }
        .recent-table td { padding: 12px; border-bottom: 1px solid #f5f5f5; font-size: 0.9rem; }
        
        .action-cell { display: flex; align-items: center; justify-content: start; gap: 12px; }
        .btn-action { border: none; background: none; cursor: pointer; font-size: 1.1rem; padding: 5px; }
        .btn-edit { color: var(--accent-color); }
        .btn-delete { color: #ff7675; }
        h3 { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="header">
    <a href="index.html"><i class="fas fa-arrow-right"></i></a>
    <h2 style="margin:0; font-size:1.3rem;">تسجيل شحنة جديدة 📦</h2>
</div>

<div class="container">
    <div id="mainCard" class="card">
        <input type="hidden" id="editKey" value=""> 
        
        <div class="form-group">
            <label>العميل (البحث الذكي):</label>
            <select id="shipCustomer">
                <option value="">-- ابحث عن العميل هنا --</option>
            </select>
        </div>

        <div class="form-group">
            <label>شركة الشحن:</label>
            <select id="shipCompany" onchange="calculate()">
                <option value="0">-- اختر الشركة --</option>
            </select>
        </div>

        <div class="form-group">
            <label>عدد الطرود:</label>
            <input type="number" id="pkgCount" value="1" min="1" oninput="calculate()">
        </div>

        <div class="calculation-box">
            <div style="color:#888; font-size: 0.8rem;">إجمالي المستحق للشركة</div>
            <div class="total-price"><span id="totalDisplay">0</span> ج.م</div>
        </div>

        <button id="saveBtn" class="btn-submit" onclick="saveShipment()">
            <i class="fas fa-save"></i> <span id="btnText">حفظ الشحنة</span>
        </button>
    </div>

    <h3 style="margin: 25px 10px 10px; font-size: 1rem;">آخر العمليات المسجلة (Live)</h3>
    <table class="recent-table">
        <thead>
            <tr>
                <th>العميل</th>
                <th>التفاصيل</th>
                <th>الإجمالي</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody id="recentBody"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAzjuBkBAKS5Y_gU7qmwwaMh1Ay9me1uds",
        authDomain: "swiftship-c829c.firebaseapp.com",
        projectId: "swiftship-c829c",
        databaseURL: "https://swiftship-c829c-default-rtdb.firebaseio.com/",
        storageBucket: "swiftship-c829c.firebasestorage.app",
        messagingSenderId: "410866251849",
        appId: "1:410866251849:web:4c606d59d83c2c2756a798"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allShipments = {};

    // تفعيل الـ Select2 فور جاهزية الصفحة وضبط الاتجاه للغة العربية
    $(document).ready(function() {
        $('#shipCustomer').select2({
            dir: "rtl",
            placeholder: "-- ابحث عن العميل هنا --",
            allowClear: true
        });
    });

    function initLists() {
        // تحميل العملاء وتحديث الـ Select2
        db.ref('customers').once('value', snap => {
            const select = $('#shipCustomer');
            const data = snap.val();
            if(data) {
                select.empty().append('<option value="">-- ابحث عن العميل هنا --</option>');
                Object.values(data).forEach(c => {
                    select.append(new Option(c.name, c.name));
                });
                select.trigger('change'); // إشعار Select2 بالتحديث
            }
        });

        // تحميل الشركات
        db.ref('companies').once('value', snap => {
            const select = document.getElementById('shipCompany');
            const data = snap.val();
            if(data) Object.values(data).forEach(c => {
                let opt = new Option(`${c.name} (${c.price}ج)`, c.price);
                opt.setAttribute('data-name', c.name);
                select.add(opt);
            });
        });
    }

    function calculate() {
        const compSelect = document.getElementById('shipCompany');
        const price = parseFloat(compSelect.value) || 0;
        const count = parseInt(document.getElementById('pkgCount').value) || 0;
        document.getElementById('totalDisplay').innerText = (price * count);
    }

    db.ref('shipments').on('value', snapshot => {
        allShipments = snapshot.val() || {};
        renderRecent();
    });

    function saveShipment() {
        // جلب القيمة من Select2 باستخدام jQuery
        const customer = $('#shipCustomer').val();
        const compSelect = document.getElementById('shipCompany');
        const companyPrice = compSelect.value;
        const companyName = compSelect.options[compSelect.selectedIndex].getAttribute('data-name');
        const count = parseInt(document.getElementById('pkgCount').value);
        const total = document.getElementById('totalDisplay').innerText;
        const editKey = document.getElementById('editKey').value;

        const now = new Date();
        const today = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;

        if(!customer || companyPrice == "0") return alert("برجاء اختيار العميل والشركة أولاً");

        if(editKey) {
            db.ref('shipments/' + editKey).update({
                customer, companyName, count, total
            }).then(() => { alert("تم تحديث الشحنة"); resetForm(); });
        } else {
            const duplicateKey = Object.keys(allShipments).find(k => 
                allShipments[k].customer === customer && 
                allShipments[k].dateOnly === today && 
                allShipments[k].status !== 'paid'
            );

            if(duplicateKey) {
                if(confirm(`العميل مسجل اليوم بالفعل. هل تريد فتح بيانات الشحنة لتعديلها؟`)) {
                    loadForEdit(duplicateKey);
                    return;
                } else return;
            }

            db.ref('shipments').push({
                customer, companyName, count, total,
                status: 'pending',
                dateOnly: today,
                dateTime: now.toLocaleString()
            }).then(() => { alert("تم حفظ شحنة جديدة"); resetForm(); });
        }
    }

    function loadForEdit(key) {
        const s = allShipments[key];
        document.getElementById('editKey').value = key;
        
        // تحديث قيمة Select2 في وضع التعديل
        $('#shipCustomer').val(s.customer).trigger('change');
        
        const compSelect = document.getElementById('shipCompany');
        for(let i=0; i<compSelect.options.length; i++) {
            if(compSelect.options[i].getAttribute('data-name') === s.companyName) {
                compSelect.selectedIndex = i;
                break;
            }
        }
        
        document.getElementById('pkgCount').value = s.count;
        calculate();
        
        document.getElementById('mainCard').classList.add('edit-mode');
        document.getElementById('saveBtn').classList.add('edit-btn');
        document.getElementById('btnText').innerText = "تعديل الشحنة الحالية";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editKey').value = "";
        
        // تصفير قائمة Select2 وتحديث شكلها
        $('#shipCustomer').val('').trigger('change');
        
        document.getElementById('shipCompany').selectedIndex = 0;
        document.getElementById('pkgCount').value = 1;
        document.getElementById('totalDisplay').innerText = "0";
        document.getElementById('mainCard').classList.remove('edit-mode');
        document.getElementById('saveBtn').classList.remove('edit-btn');
        document.getElementById('btnText').innerText = "حفظ الشحنة";
    }

    function renderRecent() {
        const tbody = document.getElementById('recentBody');
        const keys = Object.keys(allShipments).reverse().slice(0, 10);

        tbody.innerHTML = keys.map(key => {
            const s = allShipments[key];
            return `
            <tr>
                <td><b>${s.customer}</b></td>
                <td>${s.count} طرد<br><small>${s.companyName}</small></td>
                <td style="color:var(--primary-color); font-weight:bold;">${s.total}ج</td>
                <td>
                    <div class="action-cell">
                        ${s.status === 'paid' ? 
                            '<i class="fas fa-check-circle" style="color:#2ecc71"></i>' : 
                            '<i class="fas fa-clock" style="color:#bdc3c7"></i>'}
                        
                        <button class="btn-action btn-edit" onclick="loadForEdit('${key}')">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteShipment('${key}')">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function deleteShipment(key) {
        if(!confirm("حذف هذه العملية؟")) return;
        db.ref('shipments/' + key).remove();
    }

    initLists();
</script>
</body>
</html>
