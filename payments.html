<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سند صرف مالي | SwiftShip</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            --text-color: #2d3436;
            --bg: #f9f9f9;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(-45deg, #23d5ab, #23a6d5, #00b894);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            margin: 0; min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        header {
            background: var(--primary-grad);
            color: white; padding: 35px 20px;
            text-align: center; border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px; box-shadow: 0 4px 15px rgba(0,184,148,0.3);
            position: relative;
        }

        .container { padding: 20px; max-width: 500px; margin: -30px auto 0; }

        .card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #2d3436; }
        
        select, input {
            width: 100%; padding: 15px; border: 2px solid #eee;
            border-radius: 12px; font-size: 1rem; box-sizing: border-box;
            background: #fff; outline: none; transition: 0.3s;
        }

        input:focus, select:focus { border-color: #00b894; box-shadow: 0 0 10px rgba(0,184,148,0.1); }

        .btn-pay {
            background: var(--primary-grad); color: white; border: none;
            width: 100%; padding: 18px; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,184,148,0.3);
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-pay:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,184,148,0.4); }
        .btn-pay:active { transform: scale(0.96); }

        .back-btn {
            position: absolute; right: 20px; top: 35px;
            color: white; font-size: 1.2rem; text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-right"></i></a>
    <h2>سند صرف نقدي 💸</h2>
    <p>تسجيل دفعة مالية لشركة شحن</p>
</header>

<div class="container">
    <div class="card">
        <div class="form-group">
            <label><i class="fas fa-building"></i> اسم الشركة:</label>
            <select id="payCompany">
                <option value="">-- جاري تحميل الشركات... --</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fas fa-coins"></i> المبلغ المدفوع (ج.م):</label>
            <input type="number" id="payAmount" placeholder="0.00" inputmode="decimal">
        </div>

        <div class="form-group">
            <label><i class="fas fa-sticky-note"></i> ملاحظات:</label>
            <input type="text" id="payNote" placeholder="مثلاً: عهدة سائق، تسوية حساب...">
        </div>

        <button class="btn-pay" id="saveBtn" onclick="savePayment()">
            <i class="fas fa-check-circle"></i> تأكيد صرف المبلغ
        </button>
    </div>
</div>

<script>
    // تكوين Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAzjuBkBAKS5Y_gU7qmwwaMh1Ay9me1uds",
        authDomain: "swiftship-c829c.firebaseapp.com",
        projectId: "swiftship-c829c",
        databaseURL: "https://swiftship-c829c-default-rtdb.firebaseio.com/",
        storageBucket: "swiftship-c829c.firebasestorage.app",
        messagingSenderId: "410866251849",
        appId: "1:410866251849:web:4c606d59d83c2c2756a798"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. تحميل الشركات من Firebase لملء القائمة
    function loadCompanies() {
        db.ref('companies').once('value', (snap) => {
            const select = document.getElementById('payCompany');
            select.innerHTML = '<option value="">-- اختر الشركة --</option>';
            const data = snap.val();
            if(data) {
                Object.values(data).forEach(c => {
                    let opt = new Option(c.name, c.name);
                    select.add(opt);
                });
            } else {
                select.innerHTML = '<option value="">لا توجد شركات مسجلة</option>';
            }
        });
    }

    // 2. حفظ سند الصرف في Firebase
    function savePayment() {
        const company = document.getElementById('payCompany').value;
        const amount = document.getElementById('payAmount').value;
        const note = document.getElementById('payNote').value;
        const saveBtn = document.getElementById('saveBtn');

        if(!company || !amount || amount <= 0) {
            return alert("يرجى اختيار الشركة وتحديد مبلغ صحيح");
        }

        // تعطيل الزر لمنع التكرار أثناء الحفظ
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';

        const paymentData = {
            companyName: company,
            amount: parseFloat(amount),
            note: note || "بدون ملاحظات",
            date: new Date().toLocaleDateString('ar-EG'),
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        // الحفظ في فرع payments
        db.ref('payments').push(paymentData)
            .then(() => {
                alert("تم تسجيل سند الصرف بنجاح ✅");
                window.location.href = 'index.html';
            })
            .catch((error) => {
                alert("حدث خطأ: " + error.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "تأكيد صرف المبلغ";
            });
    }

    // تشغيل تحميل الشركات عند فتح الصفحة
    loadCompanies();
</script>

</body>
</html>
