<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftShip | Dashboard</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6c5ce7;
            --accent: #00b894;
            --dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex; flex-direction: column; color: var(--dark);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- البانر المبتكر الجديد --- */
        header {
            padding: 30px 10px;
            display: flex;
            justify-content: center;
        }

        .header-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 20px 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header-card h1 {
            font-size: 2.2rem; margin: 0; font-weight: 900;
            color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 15px; justify-content: center;
        }

        .header-card h1 i { font-size: 1.8rem; color: #fff; }

        .header-card p {
            color: white; font-weight: 300; margin: 5px 0 0;
            font-size: 0.9rem; opacity: 0.9;
        }

        .status-pill {
            background: rgba(255, 255, 255, 0.2);
            color: white; padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; display: inline-block; margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* --- باقي التنسيقات كما هي --- */
        .container {
            padding: 10px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; width: 90%;
        }

        .menu-card {
            background: var(--glass);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px; padding: 25px 15px;
            text-align: center; text-decoration: none; color: var(--dark);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .menu-card:hover { transform: translateY(-8px); background: white; box-shadow: 0 15px 45px rgba(0,0,0,0.1); }

        .menu-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            
            /* السطرين دول مع بعض عشان التوافقية */
            -webkit-background-clip: text; 
            background-clip: text; 
            
            -webkit-text-fill-color: transparent;
        }

        .menu-card span { font-weight: 700; font-size: 0.95rem; }

        .card-cust i { background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; }
        .card-ship i { background: linear-gradient(135deg, #0984e3, #74b9ff); -webkit-background-clip: text; }
        .card-coll i { background: linear-gradient(135deg, #00b894, #55efc4); -webkit-background-clip: text; }
        .card-comp i { background: linear-gradient(135deg, #e67e22, #fab1a0); -webkit-background-clip: text; }

        .footer { margin-top: auto; text-align: center; padding: 20px; color: white; font-size: 0.8rem; opacity: 0.7; }

        @media (max-width: 480px) {
            .container { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .header-card { padding: 15px 25px; width: 80%; }
            .header-card h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-card">
        <h1><i class="fas fa-paper-plane"></i>SwiftShip</h1>
        <p>نظام الشحن والتحصيلات</p>
        <div id="connection-status" class="status-pill">جاري المزامنة...</div>
    </div>
</header>

<div class="container">
    <a href="customers.html" class="menu-card card-cust">
        <i class="fas fa-users-cog"></i>
        <span>العملاء</span>
    </a>
    
   <a href="companies.html" class="menu-card card-comp">
        <i class="fas fa-truck-loading"></i>
        <span>الشركات</span>
    </a>
   
    <a href="shipment.html" class="menu-card card-ship">
        <i class="fas fa-box-open"></i>
        <span>شحنة جديدة</span>
    </a>

    <a href="collections.html" class="menu-card card-coll">
        <i class="fas fa-wallet"></i>
        <span>التحصيلات</span>
    </a>

    <a href="reports.html" class="menu-card">
        <i class="fas fa-chart-line" style="background: linear-gradient(135deg, #d63031, #ff7675); -webkit-background-clip: text;"></i>
        <span>التقارير</span>
    </a>

    <a href="customer-report.html" class="menu-card">
        <i class="fas fa-file-invoice" style="background: linear-gradient(135deg, #2d3436, #636e72); -webkit-background-clip: text;"></i>
        <span>كشوفات</span>
    </a>
</div>

<div class="footer">
    SwiftShip &copy; 2026 | السرعة والأمان في مكان واحد
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAzjuBkBAKS5Y_gU7qmwwaMh1Ay9me1uds",
        authDomain: "swiftship-c829c.firebaseapp.com",
        projectId: "swiftship-c829c",
        databaseURL: "https://swiftship-c829c-default-rtdb.firebaseio.com/",
        storageBucket: "swiftship-c829c.firebasestorage.app",
        messagingSenderId: "410866251849",
        appId: "1:410866251849:web:4c606d59d83c2c2756a798"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref(".info/connected").on("value", (snap) => {
        const status = document.getElementById('connection-status');
        if (snap.val() === true) {
            status.innerHTML = '<i class="fas fa-circle" style="color: #00ff00; font-size: 8px;"></i> أونلاين';
        } else {
            status.innerHTML = '<i class="fas fa-circle" style="color: #ff0000; font-size: 8px;"></i> أوفلاين';
        }
    });
</script>

</body>
</html>
